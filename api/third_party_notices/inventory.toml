# ── Copyleft code statically linked into a wheel's own extension modules ────────────────────────────────
[[static]]
files = "lxml/*.so"
fingerprint = "libiconv_open"
project = "GNU libiconv"
version = "1.18"
version_symbol = "_libiconv_version"
version_value = 0x0112
# The bytes of every file the code is linked into, as shipped (amd64). A rebuilt lxml — even at the same
# libiconv version — is a new binary carrying LGPL code: re-trace it, then update these.
file_sha256 = { "lxml/etree.cpython-312-x86_64-linux-gnu.so" = "857d4774abd3ac4382f2de2e0e8e38d4e5bdbd18afb88781b6405cefee6fa02a", "lxml/objectify.cpython-312-x86_64-linux-gnu.so" = "e0bbc24c44024d06c001a5e399143ebac39c5218da976c5a2d8a0b4ea14cb569" }
license = "LGPL-2.1-or-later"
license_text = "libiconv"
built_by = "lxml 6.1.3's wheel build (buildlibxml.py, STATIC_DEPS=true, tag lxml-6.1.3-1), from the upstream tarball, unpatched"
source = [
  { url = "https://ftp.gnu.org/pub/gnu/libiconv/libiconv-1.18.tar.gz", sha256 = "3b08f5f4f9b4eb82f151a7040bfd6fe6c6fb922efe4b1659c66ea933276965e8" },
  { pypi_sdist = "lxml==6.1.3", url = "https://pypi.org/project/lxml/6.1.3/#files", role = "the program it is linked into" },
  { url = "https://github.com/lxml/lxml/archive/f9e4999ef79e1caa369f84cece0bdaf19a1ef550.tar.gz", sha256 = "65bf6c2a8e1ada016d13f7f2f78cc4b614647a83b7c8508374f79945c556d82a", role = "build recipe" },
]

# ── Where a copyleft Python package's source comes from, when it is not simply its own sdist on PyPI ───────
# psycopg-binary publishes wheels only: it is built from psycopg's C implementation (the psycopg-c sdist) by
# psycopg's own tooling, at the commit its release wheels were built from (for 3.3.9 the commit the tag points
# to: upstream's "Build binary packages" run of 2026-11-12 ran on it). Version-matched: a different
# psycopg-binary fails nothing here, but its
# NOTICES source line would then be wrong — so the row names the version it describes and is ignored otherwise.
[[python_source]]
name = "psycopg-binary"
version = "3.3.9"
source = [
  { pypi_sdist = "psycopg-c==3.3.9", url = "https://pypi.org/project/psycopg-c/3.3.9/#files", role = "the C source the wheel is built from" },
  { url = "https://github.com/psycopg/psycopg/archive/bced8a8993064a378d5ca852215d99f73f4c6cae.tar.gz", sha256 = "4f2d829269920e7f55697b89d460adfdab8515e694769b29abd0430353b7fb4c", role = "build recipe (tools/ci) at the commit the release wheels were built from" },
]

