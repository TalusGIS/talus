# ── Software the api Dockerfile adds outside Python and Debian ──────────────────────────────────────────
# Every ELF executable in /usr/local/bin must be listed here (an unlisted one fails the check). license_text
# "image:<path>" means the text ships in the image at that path.
[[binary]]
path = "/usr/local/bin/python3.12"
project = "CPython (the image's Python interpreter)"
license = "PSF-2.0"
license_text = "image:/usr/local/lib/python3.12/LICENSE.txt"
[[binary]]
path = "/usr/local/bin/pmtiles"
project = "go-pmtiles"
version = "v1.31.2"
license = "BSD-3-Clause"
license_text = "go-pmtiles"
# The Go modules compiled in: licenses/go-modules/ (MODULES.toml). The check fails when the binary's build
# info lists a different set — re-fetch their licence texts for the new version.
go_modules = "go-modules"
[[binary]]
path = "/usr/local/bin/typst"
project = "Typst"
version = "v0.15.1"
license = "Apache-2.0"
license_text = "image:/usr/share/doc/talus-third-party/typst"
# The crates compiled in: licenses/typst-crates/ (CRATES.toml, from Typst's Cargo.lock at the tag). A Rust
# binary does not record its crates, so the bytes are pinned instead: a new Typst fails the check until its
# crates' licence texts are re-fetched.
rust_crates = "typst-crates"
sha256 = "29273eaa04f6d00edd0c2bec578f565fc9c65be856bfbffc894567c68ed0b237"

[[asset]]
path = "/usr/share/talus-fonts"
project = "Liberation Sans 2.1.5 (report fonts)"
license = "OFL-1.1"
license_text = "image:/usr/share/doc/talus-third-party/liberation-fonts"

# The EPSG Geodetic Parameter Dataset, inside the PROJ library's reference database. pyproj and rasterio each
# carry a copy (proj.db; the second is at site-packages/rasterio/proj_data/proj.db), and the Dockerfile marks
# three of its records deprecated in both (datum_grids/withdraw_nad83_shifts.py). The dataset's terms of use ask
# that IOGP's ownership be acknowledged wherever it is passed on, changed copies included, and that recipients
# be told of the terms: licenses/epsg-dataset says both, and names the changed records. The release's own
# NOTICES says the same of db/proj/proj.db.
[[asset]]
path = "/usr/local/lib/python3.12/site-packages/pyproj/proj_dir/share/proj/proj.db"
