# Third-party inventory for the talus-api image — read by `python3 -m third_party_notices`.
#
# What package metadata cannot show lives here: the native libraries that Python wheels bundle (auditwheel
# `*.libs` directories), the copyleft code some wheels link statically, and where the exact source of every
# copyleft component comes from. The drift check compares the built image against this file and FAILS when:
#   * a `*.libs` directory holds a library not listed below (a new library is a licence event);
#   * a copyleft library's bytes changed (its `hashes` no longer match) — its version and source must be
#     re-traced, then updated here;
#   * copyleft code is statically linked into a file no [[static]] row covers, or a covered row's version
#     symbol changed;
#   * a wheel's licence files newly mention GPL/LGPL wording ([[licence_wording]] is the reviewed set).
# Permissive libraries are matched by name only: their versions move freely and NOTICES is regenerated.
#
# `hashes` are auditwheel's names for the grafted file: lib<name>-<first 8 hex of the ORIGINAL file's
# sha256>; a library re-grafted by a second wheel carries two. `sha256` pins the file's bytes as shipped, so a
# re-built copyleft library cannot slip through under the same name or the same version number.

[audited]
# The architecture whose bytes the hashes below pin: the only one published. On any other architecture the
# check reports instead of failing, and a release build (TALUS_RELEASE=1) fails.
arch = "amd64"

# ── Copyleft fingerprints ───────────────────────────────────────────────────────────────────────────────
