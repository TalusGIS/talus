# Enforces CONTRIBUTING.md automatically: Talus does not accept outside code contributions
# (the SQLite model), and GitHub cannot disable the PR
# button on a public repo, so the policy must be automated, not remembered. Outside PRs get a
# polite explanation and are closed; maintainers (write access) and Dependabot are exempt.
#
# Safety notes:
# - pull_request_target runs in the BASE repo context with a write token, which is safe here
#   ONLY because this job never checks out or executes PR code — it comments and closes, using
#   preinstalled `gh`. Do not add a checkout step to this workflow.
# - No third-party actions → nothing to hash-pin (the supply-chain hygiene rule holds vacuously).
name: contribution-policy
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close-outside-prs:
    # Dependabot's own PRs are first-party automation (it has repo write via its app grant).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Close outside PRs per CONTRIBUTING.md
        # author_association: OWNER/MEMBER/COLLABORATOR = someone with a real relationship to
        # the repo (the maintainer, org members, invited collaborators) — their PRs pass.
        if: ${{ !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body \
          "Thank you for taking the time to contribute — sincerely. Talus does not accept outside code contributions (see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for why — it's policy, not a judgment of your work), so this PR is being closed automatically. **Bug reports, feature requests, interop findings, and documentation feedback are genuinely welcome by email** at support@talusgis.com (this repository does not use GitHub Issues), and if this PR fixes a real bug, please email a description of it — the fix will be implemented and you'll be credited in the release notes."
          gh pr close "$PR" --repo "$REPO"
