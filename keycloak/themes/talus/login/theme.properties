# Talus GIS — Keycloak login theme (Talus 48)
#
# A CSS reskin of Keycloak's stock `keycloak` login theme — NO FreeMarker (.ftl) overrides, so it
# inherits every page (login, OTP/MFA, password update, errors, IdP buttons) and stays low-maintenance
# across Keycloak upgrades. The realm selects it via "loginTheme": "talus" (realm-export.json).
#
# `styles` lists the base login stylesheet FIRST, then our overrides. If a future Keycloak base theme
# renames/extends its style list, append here accordingly (validate in-browser after upgrade).

parent=keycloak
import=common/keycloak

styles=css/login.css css/talus-login.css

# Keep the stock internationalization + scripts from the parent; we override appearance only.
